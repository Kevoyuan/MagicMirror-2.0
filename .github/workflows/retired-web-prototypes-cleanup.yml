name: One-time cleanup of superseded Web prototype branches

on:
  push:
    branches: [main]
    paths: [".github/workflows/retired-web-prototypes-cleanup.yml"]

permissions:
  contents: write

jobs:
  delete-retired-prototypes:
    if: github.repository == 'Kevoyuan/MagicMirror-2.0'
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacements before deleting exact stale branch heads
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const read = async (path) => {
              const {data} = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              return Buffer.from(data.content,'base64').toString('utf8');
            };
            const mainUI = await read('Web/src/main.ts');
            const mainDesign = await read('DESIGN.md');
            const browserTest = await read('Web/tests/browser/original-demo.spec.ts');
            const webCI = await read('.github/workflows/web-mvp.yml');
            if (!mainUI.includes('diagnostics-disclosure') ||
                !mainUI.includes('part-note-more') ||
                !mainDesign.includes('Leonardo') ||
                !browserTest.includes('test(') ||
                !webCI.includes('test:browser') ||
                !webCI.includes('WebKit')) {
              throw new Error('Replacement design or browser E2E is missing from main; refusing branch deletion');
            }
            const retired = [
              ['design/web-leonardo-camera-first-folio','b6b41401806e744c764b64d44ebbb976ae07cd4c'],
              ['qa/web-original-demo-playwright-smoke','3968df2d56069015f9ab691b8cf1f0fdcd2d1a34']
            ];
            for (const [branch, expected] of retired) {
              let head;
              try {
                ({data:head} = await github.rest.git.getRef({owner,repo,ref:`heads/${branch}`}));
              } catch (err) {
                if (err.status === 404) { core.info(`Already absent ${branch}`); continue; }
                throw err;
              }
              if (head.object.sha !== expected) {
                throw new Error(`Source ${branch} changed; refusing to delete ${head.object.sha}`);
              }
              await github.rest.git.deleteRef({owner,repo,ref:`heads/${branch}`});
              core.info(`Deleted superseded prototype ${branch}`);
            }
