name: Pose sidecar protocol tests

on:
  push:
    paths:
      - 'Tools/pose_sidecar/**'
      - '.github/workflows/pose-sidecar-tests.yml'
  pull_request:
    paths:
      - 'Tools/pose_sidecar/**'
      - '.github/workflows/pose-sidecar-tests.yml'

jobs:
  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python code
        run: python -m compileall -q Tools/pose_sidecar
      - name: Run self-contained framing/demo tests
        run: python -m unittest discover -s Tools/pose_sidecar/tests -v
      - name: Generate and audit deterministic synthetic dropout trace
        run: |
          python -m Tools.pose_sidecar.benchmark --scenario dropout --fps 20 --seconds 6 --write-trace "$RUNNER_TEMP/magicmirror-pose.jsonl" --report "$RUNNER_TEMP/magicmirror-quality.json"
          python -m Tools.pose_sidecar.benchmark --input "$RUNNER_TEMP/magicmirror-pose.jsonl"
          python - "$RUNNER_TEMP/magicmirror-quality.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["traceSource"] == "synthetic"
          assert data["frameCount"] == 120
          assert data["missingCorePoseFrames"] == 4
          assert data["approxMaxMissingCorePoseMs"] == 200
          assert data["observedSourceFps"] == 20
          print("PASS: deterministic synthetic M1 dropout trace contract")
          PY
      - name: Explain limitations
        run: echo 'MediaPipe inference, Unity C# compilation and camera runtime are NOT tested here.'

  synthetic-jpeg-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only image codec dependencies (NO MediaPipe)
        run: python -m pip install "opencv-python-headless>=4.10,<5" "numpy>=1.26,<3"
      - name: Test actual synthetic JPEG encoding and decode
        run: python -m unittest Tools.pose_sidecar.tests.test_demo_video_opencv Tools.pose_sidecar.tests.test_sidecar_integration -v
      - name: State limitations
        run: echo 'This verifies synthetic image bytes, NOT a Unity renderer or physical camera.'


  real-mediapipe-video-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux native libraries required by MediaPipe runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2 libegl1 libgl1
      - name: Install real MediaPipe Tasks and camera dependencies
        run: python -m pip install -r Tools/pose_sidecar/requirements.txt
      - name: Download temporary official Lite model
        run: python -m Tools.pose_sidecar.download_model --profile lite
      - name: Verify exact Lite task bundle SHA-256 (before running inference)
        run: python -m Tools.pose_sidecar.download_model --profile lite --verify-only
      - name: Execute actual VIDEO inference on synthetic blank image
        run: |
          python -m Tools.pose_sidecar.smoke_runtime --profile lite --frames 3 --report "$RUNNER_TEMP/m1-real-runtime-report.json"
          python - "$RUNNER_TEMP/m1-real-runtime-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["mode"] == "VIDEO"
          assert report["frames"] == 3
          assert report["landmarkSchema"] == 33
          assert len(report["modelSha256"]) == 64
          assert len(report["posesPerFrame"]) == 3
          assert report["mediapipeVersion"]
          print("PASS: real MediaPipe VIDEO API, wheel and task bundle loaded")
          PY
      - name: Scope disclaimer
        run: |
          echo 'Blank synthetic image only, no real-person detection benchmark.'
          echo 'Lite SHA-256/size locked; Full/Heavy not yet locked or runtime-tested.'
          echo 'No Unity, real camera, end-to-end latency or anatomy FBX validation.'

  real-mediapipe-profile-matrix:
    name: MediaPipe real model smoke (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [full, heavy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native GLES/EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgles2 libegl1 libgl1
      - name: Install tested Python runtime
        run: python -m pip install -r Tools/pose_sidecar/requirements.txt
      - name: Fetch model outside Git and check local integrity
        run: |
          python -m Tools.pose_sidecar.download_model --profile "${{ matrix.profile }}"
          python -m Tools.pose_sidecar.download_model --profile "${{ matrix.profile }}" --verify-only
      - name: Execute MediaPipe VIDEO model on blank synthetic images
        run: |
          python -m Tools.pose_sidecar.smoke_runtime --profile "${{ matrix.profile }}" --frames 3 --report "$RUNNER_TEMP/m1-model.json"
          python - "$RUNNER_TEMP/m1-model.json" "${{ matrix.profile }}" <<'PY'
          import json, sys
          from Tools.pose_sidecar.download_model import EXPECTED_MODEL_BYTES, EXPECTED_MODEL_SHA256
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          profile = sys.argv[2]
          assert data["mediapipeVersion"] == "0.10.35"
          assert data["mode"] == "VIDEO"
          assert data["landmarkSchema"] == 33
          assert data["frames"] == 3
          assert len(data["posesPerFrame"]) == 3
          assert data["modelFileName"] == f"pose_landmarker_{profile}.task"
          assert data["modelSha256"] == EXPECTED_MODEL_SHA256[profile]
          assert data["modelSizeBytes"] == EXPECTED_MODEL_BYTES[profile]
          print("PASS: verified", profile, "bundle size/SHA-256 + actual VIDEO inference")
          PY
      - name: Scope disclaimer
        run: echo 'Synthetic blank-frame model/API smoke only; NOT real-person accuracy, target FPS, segmentation, Unity or AR.'
