name: Whole atlas source and inventory checks

on:
  push:
    paths:
      - 'Tools/anatomy_tools/**'
      - 'Mobile/iOS/Scripts/export_full_atlas.py'
      - 'Mobile/iOS/Scripts/atlas_sources.py'
      - 'Mobile/iOS/Scripts/atlas_license_evidence.py'
      - 'Mobile/iOS/Scripts/atlas_rig_manifest.py'
      - 'Mobile/iOS/Scripts/verify_atlas_package.py'
      - 'Mobile/iOS/Scripts/assemble_reviewed_atlas_rig.py'
      - 'Mobile/iOS/Scripts/tests/**'
      - 'Assets-Manifest/asset_sources.json'
      - '.github/workflows/anatomy-inventory-tests.yml'
  pull_request:
    paths:
      - 'Tools/anatomy_tools/**'
      - 'Mobile/iOS/Scripts/export_full_atlas.py'
      - 'Mobile/iOS/Scripts/atlas_sources.py'
      - 'Mobile/iOS/Scripts/atlas_rig_manifest.py'
      - 'Mobile/iOS/Scripts/verify_atlas_package.py'
      - 'Mobile/iOS/Scripts/assemble_reviewed_atlas_rig.py'
      - 'Mobile/iOS/Scripts/tests/**'
      - 'Assets-Manifest/asset_sources.json'
      - '.github/workflows/anatomy-inventory-tests.yml'

jobs:
  atlas-inventory-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python tool syntax and manifest JSON
        run: |
          python -m compileall -q Tools/anatomy_tools Mobile/iOS/Scripts/export_full_atlas.py Mobile/iOS/Scripts/atlas_sources.py Mobile/iOS/Scripts/atlas_license_evidence.py Mobile/iOS/Scripts/atlas_rig_manifest.py Mobile/iOS/Scripts/assemble_reviewed_atlas_rig.py Mobile/iOS/Scripts/verify_atlas_package.py Mobile/iOS/Scripts/tests
          python -m json.tool Assets-Manifest/asset_sources.json > /dev/null
      - name: Validate pinned whole-FBX provenance against downloader
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from Tools.anatomy_tools.audit_unity_inventory import pinned_source_issues
          manifest = json.loads(Path("Assets-Manifest/asset_sources.json").read_text())
          issues = pinned_source_issues(manifest)
          assert not issues, issues
          print("PASS: complete skeletal FBX source pin consistent")
          PY
      - name: Run inventory and source-verification tests (no Blender or Unity)
        run: |
          python -m unittest discover -s Tools/anatomy_tools/tests -v
          python -m unittest discover -s Mobile/iOS/Scripts/tests -v
          python Mobile/iOS/Scripts/verify_atlas_package.py --help > /dev/null
          python Mobile/iOS/Scripts/assemble_reviewed_atlas_rig.py --help > /dev/null
          python -m Tools.anatomy_tools.audit_unity_inventory --help > /dev/null
      - name: Scope disclaimer
        run: |
          echo 'Tests cover pinned manifest and synthetic renderer inventory only.'
          echo 'The atlas preflight runs only on synthetic fixtures, never an approved licensed model.'
          echo 'They do NOT fetch a real FBX, inspect anatomy, run Blender, compile Unity or prove rig/asset license correctness.'
