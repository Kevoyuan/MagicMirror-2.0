name: M4 pure C# constrained kinematics

on:
  push:
    paths:
      - 'Unity/Assets/Scripts/Motion/TwoBoneKinematics.cs'
      - 'Tools/ci/csharp_kinematics/**'
      - '.github/workflows/m4-kinematics.yml'
  pull_request:
    paths:
      - 'Unity/Assets/Scripts/Motion/TwoBoneKinematics.cs'
      - 'Tools/ci/csharp_kinematics/**'
      - '.github/workflows/m4-kinematics.yml'

jobs:
  compile-and-execute-csharp-kinematics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile original engine-independent IK C# source
        run: dotnet build Tools/ci/csharp_kinematics/KinematicsChecks.csproj -c Release --warnaserror
      - name: Exercise two-bone IK constraints in compiled C#
        run: dotnet run -c Release --no-build --project Tools/ci/csharp_kinematics/KinematicsChecks.csproj
      - name: Distinguish scope from actual Unity runtime
        run: echo 'PASS only demonstrates compiled pure C# math; the Unity API, real FBX anchors, landmarks, motion and camera alignment are NOT verified.'
